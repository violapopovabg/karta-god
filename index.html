<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта года Виолетты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Средиземноморская палитра: прохладный светлый фон, морская бирюза — акцент, абрикос — прогресс.
     Layout: шапка с видением, вкладки, рабочие сетки карточек. Год = 4 цикла по 12 недель + 13-я неделя. */
  --bg:#f3f6f7; --surface:#ffffff; --ink:#15303a; --muted:#5a6e76; --line:#dbe3e6;
  --accent:#1d7487; --accent-soft:#e1eff2; --warm:#c96a30; --warm-soft:#fbeadf;
  --good:#2f8a5b; --good-soft:#e2f2e9; --mid:#9fcdb4; --low:#d7e9df;
  --s-health:#2f8a5b; --s-body:#c96a30; --s-disc:#15303a; --s-lang:#1d7487;
  --s-career:#7b4fa3; --s-money:#a87d0f; --s-travel:#2b6cb0; --s-growth:#a34f6c;
  --display:"Unbounded","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e191e; --surface:#15242b; --ink:#e4edef; --muted:#90a5ad; --line:#243840;
    --accent:#5bb6c8; --accent-soft:#18343c; --warm:#f0a46e; --warm-soft:#3a2a1f;
    --good:#5cc08a; --good-soft:#173328; --mid:#2f6b4d; --low:#1d3a2d;
    --s-health:#5cc08a; --s-body:#f0a46e; --s-disc:#cfdde1; --s-lang:#5bb6c8;
    --s-career:#b48ddb; --s-money:#e0b84a; --s-travel:#6fa8e8; --s-growth:#e08aa8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e191e; --surface:#15242b; --ink:#e4edef; --muted:#90a5ad; --line:#243840;
  --accent:#5bb6c8; --accent-soft:#18343c; --warm:#f0a46e; --warm-soft:#3a2a1f;
  --good:#5cc08a; --good-soft:#173328; --mid:#2f6b4d; --low:#1d3a2d;
  --s-health:#5cc08a; --s-body:#f0a46e; --s-disc:#cfdde1; --s-lang:#5bb6c8;
  --s-career:#b48ddb; --s-money:#e0b84a; --s-travel:#6fa8e8; --s-growth:#e08aa8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:500;text-wrap:balance;margin:0}
h1{font-size:clamp(1.4rem,3vw,2rem);letter-spacing:-.01em}
h2{font-size:1.02rem}
h3{font-size:.9rem}
p{margin:6px 0 0}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.words{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.word{font-family:var(--display);font-size:.78rem;padding:5px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.ok i{background:var(--good)} .status.bad i{background:var(--warm)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
nav.tabs button{font:inherit;font-weight:600;font-size:.95rem;background:none;border:0;color:var(--muted);padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,[role="checkbox"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;gap:18px}
.two{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.half{grid-template-columns:repeat(2,minmax(0,1fr))}
.three-col{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:860px){.two,.half,.three-col{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.stack{display:grid;gap:18px;align-content:start}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.daynav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.daynav .date{font-family:var(--display);font-size:1.02rem;min-width:12ch}
.btn{font:inherit;font-size:.9rem;font-weight:500;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.icon{width:36px;padding:6px 0;text-align:center}
.stage{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:12px;background:var(--accent-soft);margin-bottom:16px}
.stage .num{font-family:var(--display);font-size:1.3rem;color:var(--accent);line-height:1.1;white-space:nowrap}
.stage b{display:block}
.banner{padding:12px 14px;border-radius:10px;background:var(--warm-soft);margin-bottom:14px;font-size:.92rem}
.list{display:grid;gap:8px}
.habit{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;cursor:pointer;user-select:none;background:var(--surface)}
.habit:hover{border-color:var(--accent)}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:background .15s}
[aria-checked="true"] > .box{background:var(--good);border-color:var(--good)}
[aria-checked="true"] > .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.habit[aria-checked="true"]{background:var(--good-soft);border-color:transparent}
.habit .txt{flex:1}
.tag{font-size:.72rem;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.row-flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
textarea{width:100%;min-height:74px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
label.lbl{display:block;font-size:.85rem;color:var(--muted);margin:14px 0 6px}
.big{font-family:var(--display);font-size:2.5rem;line-height:1;font-variant-numeric:tabular-nums}
.mid-num{font-family:var(--display);font-size:1.4rem;line-height:1;font-variant-numeric:tabular-nums}
.kpi{display:flex;align-items:baseline;gap:8px;margin:6px 0 10px;flex-wrap:wrap}
.of{color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warm-soft);color:var(--warm)}
.pill.neutral{background:var(--accent-soft);color:var(--accent)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.heat .hd{font-size:.7rem;color:var(--muted);text-align:center}
.heat button{position:relative;aspect-ratio:1;border:0;border-radius:7px;font:inherit;font-size:.75rem;color:var(--ink);background:var(--bg);cursor:pointer;font-variant-numeric:tabular-nums}
.heat button.l1{background:var(--low)} .heat button.l2{background:var(--mid)} .heat button.l3{background:var(--good);color:#fff}
.heat button.fut{opacity:.45}
.heat button.sel{outline:2px solid var(--accent);outline-offset:1px}
.heat .cyc{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--s-growth)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0 0;font-size:.8rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar > span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good > span{background:var(--good)}
.bar.warm > span{background:var(--warm)}
.srow{display:grid;grid-template-columns:76px 1fr 42px;gap:8px;align-items:center;font-size:.8rem;font-variant-numeric:tabular-nums}
.srow.cur{font-weight:700}
.rules{margin:8px 0 0;padding-left:18px;font-size:.9rem}
.rules li{margin:5px 0}
.tk{display:flex;gap:10px;align-items:flex-start;padding:7px 6px;border-radius:8px;cursor:pointer;font-size:.9rem}
.tk:hover{background:var(--bg)}
.tk .box{width:18px;height:18px;border-radius:5px;margin-top:2px}
.tk[aria-checked="true"] > .box::after{width:4px;height:8px}
.tk[aria-checked="true"] .t{color:var(--muted);text-decoration:line-through}
.tk .dot{margin-top:7px}
.g-badge{font-family:var(--display);font-size:.65rem;padding:2px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);flex:none;margin-top:2px}
.g-badge.g0{background:var(--bg);color:var(--muted)}
.goalcard{border-left:4px solid var(--accent)}
.phase{display:flex;gap:6px;margin-top:10px}
.phase span{flex:1;height:6px;border-radius:99px;background:var(--line)}
.phase span.on{background:var(--warm)}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.wk.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wk header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.wk header small{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cycles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:22px}
@media (max-width:900px){.cycles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cyc-card{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.cyc-card.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cyc-card .d{font-size:.75rem;color:var(--muted)}
.cyc-card b{display:block;margin:2px 0 4px}
.cyc-card ul{margin:0;padding-left:16px;font-size:.8rem;color:var(--muted)}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.month{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.month.now{border-color:var(--accent)}
.month header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.month header small{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ev{font-size:.78rem;color:var(--warm);font-weight:600;margin:-4px 0 6px}
.stepper{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input[type="number"]{font:inherit;width:130px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
input[type="range"]{width:100%;accent-color:var(--accent)}
.rows{display:grid;gap:10px;margin-top:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:.88rem}
.row .bar{grid-column:1 / -1}
.inc{display:grid;grid-template-columns:72px 1fr 110px;gap:8px;align-items:center;font-size:.82rem;font-variant-numeric:tabular-nums}
.inc input{width:100%}
.checks{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.goals{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.dayline{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:10px}
.dayline li{display:grid;grid-template-columns:70px 1fr;gap:10px;font-size:.95rem}
.dayline time{font-family:var(--display);font-size:.75rem;color:var(--accent);padding-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:.88rem;background:var(--bg)}
.three{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.three span{font-family:var(--display);font-size:1.4rem;color:var(--accent)}
.wheel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:600px){.wheel{grid-template-columns:1fr}}
.wheel svg{width:100%;max-width:320px;height:auto;display:block;margin:0 auto}
.wrow{display:grid;grid-template-columns:1fr 90px 22px;gap:8px;align-items:center;font-size:.82rem}
.wrow b{font-variant-numeric:tabular-nums;text-align:right}
.levels{display:grid;gap:12px;margin-top:10px}
.lvl{padding:12px;border-radius:10px;background:var(--bg)}
.lvl b{font-family:var(--display);font-size:.78rem;color:var(--accent);display:block;margin-bottom:4px;font-weight:500}
.mw{overflow-x:auto;padding:12px}
.mw-row{display:grid;grid-template-columns:52px repeat(7,minmax(92px,1fr));gap:4px;min-width:720px;margin-bottom:4px}
.mw-head span{font-size:.75rem;color:var(--muted);text-align:center;font-weight:600}
.mw-t{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:4px}
.mw-c{font-size:.7rem;line-height:1.25;padding:5px 6px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.mw-c.s{background:var(--accent-soft);border-color:var(--accent)}
.mw-c.f{background:var(--good-soft);border-color:var(--good)}
.mw-c.b{background:var(--warm-soft);border-color:transparent}
.wh{overflow-x:auto;margin-top:8px}
.wh-row{display:grid;gap:4px;margin-bottom:4px;align-items:center;width:max-content}
.wh-l{font-size:.8rem}
.wh-h{font-size:.72rem;color:var(--muted);text-align:center;text-transform:capitalize}
.wh-c{display:block;text-align:center;font-size:.78rem;font-variant-numeric:tabular-nums;border-radius:6px;padding:4px 0;border:1px solid var(--line)}
a{color:var(--accent)}
[hidden]{display:none !important}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Карта года Виолетты</h1>
      <div class="muted small">23 ноября 2026 — 21 ноября 2027 · 4 цикла «12 недель в году»</div>
      <div class="words"><span class="word">самодостаточная</span><span class="word">здоровая</span><span class="word">красивая</span></div>
    </div>
    <div class="status" id="status"><i></i><span>Загружаю…</span></div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">Сегодня</button>
    <button role="tab" data-tab="cycle" aria-selected="false">12 недель</button>
    <button role="tab" data-tab="year" aria-selected="false">Год</button>
    <button role="tab" data-tab="goals" aria-selected="false">Цели и деньги</button>
    <button role="tab" data-tab="vision" aria-selected="false">Видение</button>
  </nav>

  <section id="tab-today"></section>
  <section id="tab-cycle" hidden></section>
  <section id="tab-year" hidden></section>
  <section id="tab-goals" hidden></section>
  <section id="tab-vision" hidden></section>
</div>

<script>
/* ================= ДАННЫЕ ПЛАНА ================= */
const START = "2026-11-23";
const SPHERES = {
  health:{n:"Здоровье",c:"var(--s-health)"}, body:{n:"Тело и внешность",c:"var(--s-body)"},
  disc:{n:"Дисциплина",c:"var(--s-disc)"}, lang:{n:"Языки",c:"var(--s-lang)"},
  career:{n:"Карьера и блог",c:"var(--s-career)"}, money:{n:"Деньги",c:"var(--s-money)"},
  travel:{n:"Путешествия",c:"var(--s-travel)"}, growth:{n:"Обучение",c:"var(--s-growth)"}
};
/* Ежедневные тактики (повторяющиеся действия). Вводятся постепенно. */
const HABITS = [
  {id:"plan5", t:"Утро, 5 минут: перечитать видение и план недели", s:"disc", from:"2026-11-23"},
  {id:"wake",  t:"Подъём около 6:00 и дневной свет",          s:"disc",   from:"2026-11-23"},
  {id:"phone", t:"Телефон вне спальни с 20:30",                s:"disc",   from:"2026-11-23"},
  {id:"move",  t:"Спорт или движение, любой вид",              s:"body",   from:"2026-11-23"},
  {id:"en",    t:"Английский 40 минут самостоятельно", s:"lang",   from:"2026-11-23"},
  {id:"buffer",t:"Буферный блок: сообщения и мелочи разом, 30 мин", s:"disc", from:"2026-11-23"},
  {id:"lunch", t:"Еда по расписанию и нормальный обед",        s:"health", from:"2026-12-14"},
  {id:"coffee",t:"Кофе и чай отдельно от еды",                 s:"health", from:"2026-12-14"},
  {id:"care",  t:"Вечерний уход: кожа и фейсбилдинг",          s:"body",   from:"2026-12-14"},
  {id:"scroll",t:"Соцсети для себя меньше 1,5 часа",           s:"disc",   from:"2026-12-14"},
  {id:"career",t:"Одно действие по карьере или блогу",         s:"career", from:"2027-01-18"},
  {id:"read",  t:"Чтение 15 минут",                            s:"growth", from:"2027-01-18"},
  {id:"diction",t:"Дикция 5 минут",                            s:"lang",   from:"2027-03-01"},
  {id:"es",    t:"Испанский 10 минут",                         s:"lang",   from:"2027-06-01"}
];
/* 4 цикла: 12 рабочих недель + 13-я неделя (отдых, итоги, план следующего цикла) */
const CYCLES = [
  {n:1,from:"2026-11-23",title:"Фундамент",
   goals:[
    {g:1,s:"health",t:"Здоровье и режим",d:"Выполнение 85%+ в 9 из 12 недель, 30 тренировок, железо под контролем врача."},
    {g:2,s:"career",t:"Карьера и блог",d:"Портфолио и оффер готовы, Instagram-блог запущен, 30 сообщений потенциальным клиентам, есть второй проект."},
    {g:3,s:"lang",t:"Английский",d:"Практика каждый день; к 14 февраля — 30 минут разговора о своей работе."}]},
  {n:2,from:"2027-02-22",title:"Клиенты",
   goals:[
    {g:1,s:"money",t:"Доход 100 тыс. ₽",d:"Два проекта (40 + 60 тыс. ₽), камера куплена."},
    {g:2,s:"career",t:"Блог и навыки",d:"1 000+ подписчиков, 2 поста в неделю, курс Premiere Pro, портфолио монтажёра и 3 реалистичных AI-креатива."},
    {g:3,s:"health",t:"Здоровье и тело",d:"Плановые врачи пройдены, 36 тренировок, английский B1 (тест)."}]},
  {n:3,from:"2027-05-24",title:"Лето",
   goals:[
    {g:1,s:"body",t:"Тело к лету",d:"Подтянутые бёдра, ровная спина, 36 тренировок, фото прогресса."},
    {g:2,s:"career",t:"Продукт и 3 000 подписчиков",d:"Первый продукт блога запущен, After Effects: основы."},
    {g:3,s:"lang",t:"Испанский с нуля",d:"10 минут в день; поездки в Грецию и Испанию."}]},
  {n:4,from:"2027-08-23",title:"Масштаб",
   goals:[
    {g:1,s:"money",t:"Доход 150 тыс. ₽",d:"4 проекта + доход от блога."},
    {g:2,s:"career",t:"10 000 подписчиков",d:"Первое сотрудничество с брендом, курс по маркетингу и брендингу."},
    {g:3,s:"lang",t:"Языки и речь",d:"30 минут разговора на английском, испанский A1–A2, курс ораторского мастерства."}]}
];
/* Тактики цикла 1 по неделям: [id, номер цели (0 — общее), текст] */

/* ================= СОСТОЯНИЕ И СОХРАНЕНИЕ ================= */
const blank = () => ({days:{},done:{d0:true},tactics:{},books:0,projects:1,subs:0,msgs:0,income:{},savings:{},net:{},myg:{h1:true,h2:true},wheel:{},wheelHist:{},commit:{},weeks:{},goals:{},vision:{}});
let state = blank();
let docRef = null, saveTimer = null, chain = Promise.resolve();
const merge = o => { const st = Object.assign(blank(), o||{}); if (st.wheel && Object.keys(st.wheel).length && !Object.keys(st.wheelHist||{}).length){ st.wheelHist = {"2026-11": st.wheel}; } return st; };
try { const s = localStorage.getItem("violetta-year"); if (s) state = merge(JSON.parse(s)); } catch(e) {}
function saveLocal(){ try { localStorage.setItem("violetta-year", JSON.stringify(state)); } catch(e) {} }
function setStatus(kind, text){ const el=document.getElementById("status"); el.className="status "+(kind||""); el.querySelector("span").textContent=text; }
function save(){
  saveLocal(); clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!docRef) return;
    const body = JSON.parse(JSON.stringify(state));
    chain = chain.then(() => docRef.set(body))
      .then(() => setStatus("ok","Сохранено"))
      .catch(err => setStatus("bad", err && err.code==="invalid_argument" ? "Нет прав на запись" : "Не сохранилось, попробуй ещё раз"));
  }, 700);
}
(async () => {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch(e) { db = null; }
  if (!db) { setStatus("bad","Сохраняется только в этом браузере"); return; }
  docRef = db.doc("tracker/main");
  const timer = setTimeout(() => setStatus("bad","Не удаётся связаться с хранилищем"), 10000);
  docRef.onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(timer); setStatus("ok","Сохранено"); }
    if (snap.metadata.hasPendingWrites) return;
    if (snap.exists) { state = merge(JSON.parse(JSON.stringify(snap.data()))); saveLocal(); renderAll(); }
    else if (Object.keys(state.days).length || Object.keys(state.tactics).length) save();
  }, () => { clearTimeout(timer); setStatus("bad","Хранилище недоступно"); });
})();

/* ================= РАСЧЁТЫ ================= */
const active = d => HABITS.filter(h => h.from <= d);
const rec = d => state.days[d] || (state.days[d] = {h:{},w:false,note:""});
function dayScore(d){
  const a = active(d); if (!a.length || d < START) return null;
  const r = state.days[d]; const done = a.filter(h => r && r.h && r.h[h.id]).length;
  return {done, total:a.length, pct:done/a.length};
}
/* Оценка недели = (ежедневные тактики + недельные тактики) выполнено / запланировано */
function weekScore(mon){
  let done=0,total=0,w=0,hd=0,ht=0;
  for (let i=0;i<7;i++){ const d=addDays(mon,i);
    if (state.days[d] && state.days[d].w) w++;
    if (d>TODAY) continue; const s=dayScore(d); if (s){hd+=s.done; ht+=s.total;} }
  const p = pos(mon); let td=0, tt=0;
  if (p){ const ts = tacticsFor(p.c,p.w); tt = ts.length; td = ts.filter(isDone).length; }
  done = hd+td; total = ht+tt;
  return {pct: (mon>TODAY||!total)? null : done/total, workouts:w, hd, ht, td, tt};
}
const workoutsBetween = (a,b) => Object.entries(state.days).filter(([d,r]) => r && r.w && d>=a && d<=b).length;
const workoutsTotal = () => workoutsBetween("2000-01-01","2100-01-01");
const enDaysBetween = (a,b) => Object.entries(state.days).filter(([d,r]) => r && r.h && r.h.en && d>=a && d<=b).length;
const pctTxt = p => p==null ? "—" : Math.round(p*100)+"%";
const phaseOf = w => PHASES.find(p => w>=p.w[0] && w<=p.w[1]);
const periodOf = w => PERIODS.find(p => w>=p.w[0] && w<=p.w[1]);
const cycleEnd = c => addDays(CYCLES[c-1].from, 83);

/* ================= ОТРИСОВКА ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dot = s => `<span class="dot" style="background:${SPHERES[s].c}"></span>`;
const gBadge = g => `<span class="g-badge ${g==="0"?"g0":""}">${g==="0"?"общее":"Ц"+g}</span>`;
const tacticRow = t => t.auto
  ? `<div class="tk" role="checkbox" aria-checked="${isDone(t)}" aria-disabled="true" style="cursor:default"><span class="box"></span>${gBadge(t.g)}<span class="t">${esc(t.t)}</span></div>`
  : `<div class="tk" role="checkbox" tabindex="0" aria-checked="${isDone(t)}" data-t="${t.id}"><span class="box"></span>${gBadge(t.g)}<span class="t">${esc(t.t)}</span></div>`;
const scorePill = p => p==null ? "" : p>=.85 ? `<span class="pill good">отличная неделя</span>` : `<span class="pill warn">цель — 85%</span>`;

function renderCycle(){
  const now = pos(TODAY < START ? START : TODAY) || {c:4,w:13};
  const c = now.c, C = CYCLES[c-1], end = cycleEnd(c);
  let weeks85 = 0, sum = 0, n = 0;
  for (let w=1; w<=12; w++){ const s = weekScore(weekStart(c,w)); if (s.pct!=null){ n++; sum+=s.pct; if (s.pct>=.85) weeks85++; } }
  const avg = n ? sum/n : null;
  const lead = c===1 ? {
    1:`Действия: недель с оценкой 85%+ — <b>${weeks85}</b> из 9 · тренировок — <b>${workoutsBetween(C.from,end)}</b> из 30`,
    2:`Действия: сообщений клиентам — <b>${state.msgs}</b> из 30 <span class="stepper" style="display:inline-flex;vertical-align:middle;margin-left:6px"><button class="btn icon" data-msg="-1" aria-label="Минус сообщение">−</button><button class="btn icon" data-msg="1" aria-label="Плюс сообщение">+</button></span>`,
    3:`Действия: дней с английским — <b>${enDaysBetween(C.from,end)}</b> из 84`
  } : {};
  const lag = c===1 ? {
    1:`Результат: анализ сдан — <b>${state.tactics["c1w1-b"]?"да":"нет"}</b>, программа тренировок согласована — <b>${state.tactics["c1w2-a"]?"да":"нет"}</b>`,
    2:`Результат: проекты — <b>${state.projects}</b> из 2, блог запущен — <b>${state.tactics["c1w2-c"]?"да":"нет"}</b>, портфолио — <b>${state.tactics["c1w3-b"]?"готово":"нет"}</b>`,
    3:`Результат: 30 минут разговора о работе — <b>${state.tactics["c1w12-c"]?"пройдено":"впереди"}</b>`
  } : {};
  const gk = g => `c${c}g${g}`;
  const goals = C.goals.map(g => { const gs = (state.goals||{})[gk(g.g)] || {};
    return `<div class="card goalcard" style="border-left-color:${SPHERES[g.s].c}">
      <span class="g-badge">Цель ${g.g}</span><h2 style="margin-top:8px">${g.t}</h2><p class="small">${g.d}</p>
      ${lead[g.g]?`<p class="small muted" style="margin-top:10px">${lead[g.g]}</p>`:""}
      ${lag[g.g]?`<p class="small muted" style="margin-top:4px">${lag[g.g]}</p>`:""}
      <label class="lbl" for="gw-${g.g}">Почему эта цель важна? Что изменится, если я её достигну?</label>
      <textarea id="gw-${g.g}" data-goal="${gk(g.g)}" data-gf="why" style="min-height:60px">${esc(gs.why)}</textarea>
      <label class="lbl" for="gh-${g.g}">Какие действия будут сложными и как я с этим справлюсь?</label>
      <textarea id="gh-${g.g}" data-goal="${gk(g.g)}" data-gf="hard" style="min-height:60px">${esc(gs.hard)}</textarea></div>`; }).join("");
  let weeks = "", rows = "";
  for (let w=1; w<=13; w++){
    const m = weekStart(c,w), s = weekScore(m), ts = tacticsFor(c,w), isNow = now.c===c && now.w===w;
    weeks += `<article class="wk ${isNow?'now':''}"><header><h3>${w===13?"Неделя 13":"Неделя "+w}</h3><small>${fmtShort(m)} — ${fmtShort(addDays(m,6))}${s.pct!=null?" · "+pctTxt(s.pct):""}</small></header>${ts.map(tacticRow).join("")}</article>`;
    if (w<=12) rows += `<div class="srow ${isNow?'cur':''}"><span>Неделя ${w}</span><div class="bar ${s.pct!=null&&s.pct>=.85?'good':''}"><span style="width:${s.pct==null?0:Math.round(s.pct*100)}%"></span></div><span>${pctTxt(s.pct)}</span></div>`;
  }
  const curMon = weekStart(now.c, now.w), wk = state.weeks[curMon] || {};
  const prev = now.w>1 ? weekScore(weekStart(now.c, now.w-1)) : null;
  const ph = phaseOf(now.w), per = periodOf(now.w);
  const ta = (id,f,label,ph2) => `<label class="lbl" for="${id}">${label}</label><textarea id="${id}" data-wk="${f}" ${ph2?`placeholder="${ph2}"`:""}>${esc(wk[f])}</textarea>`;
  const head = `<div class="mw-row mw-head"><span></span>${MODEL_DAYS.map(d=>`<span>${d}</span>`).join("")}</div>`;
  const mrows = MODEL.map(([t,txt,days]) => `<div class="mw-row"><span class="mw-t">${t}</span>${MODEL_DAYS.map(d=> (days==="*"||days.split(",").includes(d)) ? `<span class="mw-c ${/Стратегич/.test(txt)?'s':/Свободн/.test(txt)?'f':/Буфер/.test(txt)?'b':''}" title="${esc(txt)}">${esc(txt)}</span>` : `<span></span>`).join("")}</div>`).join("");
  $("tab-cycle").innerHTML = `
    <div class="row-flex" style="margin-bottom:14px">
      <div><h2>Цикл ${c} «${C.title}»</h2><span class="small muted">${fmtShort(C.from)} — ${fmtShort(end)} · неделя 13: ${fmtShort(addDays(end,1))} — ${fmtShort(addDays(end,7))}</span></div>

        <div class="kpi" style="margin-top:12px"><span class="mid-num">${prev?pctTxt(prev.pct):"—"}</span><span class="of">оценка прошлой недели${prev&&prev.pct!=null&&prev.pct<.6?" · ниже 60% — сигнал попросить помощи у группы поддержки":""}</span></div>
        ${ta("wk-res","res","Результаты на сегодня по целям цикла","Например: портфолио собрано на треть, 4 тренировки за цикл")}
        ${ta("wk-win","win","Что сработало — мой секрет успеха этой недели")}
        ${ta("wk-block","block","Что не выполнено и почему: ошибка в плане или в выполнении?","Если оценка ниже 85% — сначала выполнять план, а не менять его")}
        ${ta("wk-next","next","Обещание на эту неделю и чем мне может помочь группа")}
      </div>
      <div class="stack">
        <div class="card"><h3>${per.n}</h3><p class="small">${per.d}</p></div>
        <div class="card"><h3>Эмоциональный цикл перемен</h3>

          <p class="small muted" style="margin-top:8px">Если сдаться в момент отчаяния, всё начинается заново с оптимизма. Сюда привязаны недели примерно: у каждого цикл идёт по-своему.</p></div>
        <div class="card"><h3>Действия и результаты</h3>
          <p class="small">Оценка недели измеряет действия, которые ты контролируешь. Результаты приходят позже. Если результата нет, а оценка 85%+ — меняем план. Если оценка ниже — сначала выполняем план: чаще всего ошибка в выполнении, а не в плане.</p></div>
        <div class="card"><h3>Оценки недель</h3><div class="grid" style="gap:5px;margin-top:10px">${rows}</div></div>
      </div>
    </div>
    <h2 style="margin:26px 0 6px">Образец недели</h2>
    <p class="small muted" style="margin:0 0 12px">Черновик. Стратегический блок — в начале недели, в часы твоей лучшей энергии. Сначала ставятся стратегический, буферные и свободный блоки, потом всё остальное. Перенеси их в календарь, как встречи.</p>
    <div class="card mw">${head}${mrows}</div>
    <h2 style="margin:26px 0 12px">План цикла по неделям</h2>
    <p class="small muted" style="margin:-6px 0 12px">План недели — это 1/12 плана цикла. Добавлять новые пункты можно, но редко. ${c>1?"Тактики этого цикла составим вместе в 13-ю неделю предыдущего. ":""}Каждая тактика начинается с глагола и привязана к неделе.</p>
    <div class="weeks">${weeks}</div>`;
}

/* Колесо баланса по месяцам */
const WMONTHS = ["2026-11","2026-12","2027-01","2027-02","2027-03","2027-04","2027-05","2027-06","2027-07","2027-08","2027-09","2027-10","2027-11"];
const wmName = m => { const [y,mo]=m.split("-").map(Number); const t=new Date(y,mo-1,1).toLocaleDateString("ru-RU",{month:"long"}); return t[0].toUpperCase()+t.slice(1)+" "+y; };
const wmShort = m => { const [y,mo]=m.split("-").map(Number); return new Date(y,mo-1,1).toLocaleDateString("ru-RU",{month:"short"}).replace(".",""); };
let wheelMonth = WMONTHS.includes(TODAY.slice(0,7)) ? TODAY.slice(0,7) : (TODAY < "2026-11" ? "2026-11" : "2027-11");
const wheelOf = m => (state.wheelHist||{})[m] || null;
const wheelFilled = m => { const w = wheelOf(m); return !!(w && Object.keys(w).length); };
function prevFilled(m){ const i = WMONTHS.indexOf(m); for (let j=i-1;j>=0;j--) if (wheelFilled(WMONTHS[j])) return WMONTHS[j]; return null; }
function wheelSvg(m){
  const cx=160, cy=160, R=115, n=WHEEL.length;
  const pt = (i,v) => { const a = -Math.PI/2 + i*2*Math.PI/n, r = R*v/10; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  let rings = ""; [2,4,6,8,10].forEach(v => { rings += `<polygon points="${WHEEL.map((_,i)=>pt(i,v).join(",")).join(" ")}" fill="none" stroke="var(--line)"/>`; });
  const spokes = WHEEL.map((_,i)=>{ const [x,y]=pt(i,10); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`; }).join("");
  const cur = wheelOf(m) || {}, pm = prevFilled(m), prev = pm ? wheelOf(pm) : null;
  const vals = WHEEL.map(([k]) => +cur[k] || 5);
  const prevPoly = prev ? `<polygon points="${WHEEL.map(([k],i)=>pt(i,+prev[k]||5).join(",")).join(" ")}" fill="none" stroke="var(--warm)" stroke-width="1.5" stroke-dasharray="4 3"/>` : "";
  const poly = vals.map((v,i)=>pt(i,v).join(",")).join(" ");
  const labels = WHEEL.map(([k,l],i)=>{ const [x,y]=pt(i,11.9); const anchor = Math.abs(x-cx)<10?"middle": x>cx?"start":"end"; return `<text x="${x}" y="${y}" font-size="10" fill="var(--muted)" text-anchor="${anchor}" dominant-baseline="middle">${l}</text>`; }).join("");
  return `<svg viewBox="-100 0 520 320" role="img" aria-label="Колесо баланса за ${wmName(m)}">${rings}${spokes}${prevPoly}<polygon points="${poly}" fill="var(--accent)" fill-opacity="${wheelFilled(m)?.22:.08}" stroke="var(--accent)" stroke-width="2" ${wheelFilled(m)?"":'stroke-dasharray="2 3"'}/>${vals.map((v,i)=>{const [x,y]=pt(i,v);return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--accent)"/>`;}).join("")}${labels}</svg>`;
}
function wheelHistory(){
  const months = WMONTHS.filter(wheelFilled);
  if (!months.length) return `<p class="small muted" style="margin-top:12px">История появится, когда отметишь первый месяц.</p>`;
  const cell = v => `<span class="wh-c" style="background:color-mix(in srgb, var(--accent) ${Math.round(v*9)}%, var(--surface))${v>=7?';color:#fff':''}">${v}</span>`;
  const head = `<div class="wh-row" style="grid-template-columns:150px repeat(${months.length},44px)"><span></span>${months.map(m=>`<span class="wh-h">${wmShort(m)}</span>`).join("")}</div>`;
  const rows = WHEEL.map(([k,l]) => `<div class="wh-row" style="grid-template-columns:150px repeat(${months.length},44px)"><span class="wh-l">${l}</span>${months.map(m=>cell(+(wheelOf(m)[k])||5)).join("")}</div>`).join("");
  const avg = m => (WHEEL.reduce((a,[k])=>a+(+(wheelOf(m)[k])||5),0)/WHEEL.length).toFixed(1).replace(".",",");
  const foot = `<div class="wh-row" style="grid-template-columns:150px repeat(${months.length},44px)"><span class="wh-l"><b>Среднее</b></span>${months.map(m=>`<span class="wh-h"><b>${avg(m)}</b></span>`).join("")}</div>`;
  return `<div class="wh">${head}${rows}${foot}</div>`;
}

          <li>Телефон ночует вне спальни.</li>
        </ul></div>
      <div class="card"><h2>Энергия и окружение</h2>
        <div class="chips">${["создание контента","креатив","развитие","прогресс","упорядоченность","любимые люди рядом","путешествия","вкусная еда","здоровый сон"].map(x=>`<span class="chip">${x}</span>`).join("")}</div>
        <p class="small" style="margin-top:12px">Окружение: успешные, добрые и честные люди, в которых отражаются качества, которые я в себе воспитываю. 10 новых знакомств в сфере каждый месяц.</p></div>
    </div>
  </div>`;
}

function renderAll(){
  const ae = document.activeElement, keep = ae && ae.id && (ae.tagName==="TEXTAREA") ? ae.id : null; const keepVis = ae && ae.dataset && ae.dataset.vis;
  renderToday(); renderCycle(); renderYear(); renderGoals(); renderVision();
  if (keep){ const t=$(keep); if (t){ t.focus(); t.selectionStart=t.selectionEnd=t.value.length; } }
  else if (keepVis){ const t=document.querySelector(`[data-vis="${keepVis}"]`); if (t){ t.focus(); t.selectionStart=t.selectionEnd=t.value.length; } }
}

/* ================= СОБЫТИЯ ================= */
function toggle(el){
  const d = el.dataset;
  if (d.h){ const r=rec(sel); r.h=r.h||{}; r.h[d.h]=!r.h[d.h]; }
  else if (d.w){ const r=rec(sel); r.w=!r.w; }
  else if (d.c){ const r=rec(sel); r.c=!r.c; }
  else if (d.ms){ state.done[d.ms]=!state.done[d.ms]; }
  else if (d.my){ state.myg=state.myg||{}; state.myg[d.my]=!state.myg[d.my]; }
  else if (d.t){ state.tactics[d.t]=!state.tactics[d.t]; }
  else if (d.sign){ state.commit=state.commit||{}; state.commit.signed=!state.commit.signed; state.commit.signedAt = state.commit.signed ? parse(TODAY).toLocaleDateString("ru-RU") : ""; }
  else return false;
  save(); renderAll(); return true;
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-h],[data-w],[data-c],[data-ms],[data-t],[data-sign],[data-shift],[data-go],[data-step],[data-net],[data-msg],[data-wm],[data-wsave],[data-my],[data-tab]");
  if (!t) return;
  const d = t.dataset;
  if (d.tab){ location.hash = d.tab; return; }
  if (d.shift){ sel = addDays(sel, +d.shift); renderToday(); return; }
  if (d.go){ sel = d.go; renderToday(); return; }
  if (d.step){ state[d.step]=Math.max(0,(+state[d.step]||0)+(+d.d)); save(); renderAll(); return; }
  if (d.net){ const k=TODAY.slice(0,7); state.net=state.net||{}; state.net[k]=Math.max(0,(+state.net[k]||0)+(+d.net)); save(); renderAll(); return; }
  if (d.wm){ const i=WMONTHS.indexOf(wheelMonth)+(+d.wm); if (i>=0&&i<WMONTHS.length){ wheelMonth=WMONTHS[i]; renderVision(); } return; }
  if (d.wsave){ state.wheelHist=state.wheelHist||{}; const w=(state.wheelHist[wheelMonth]=state.wheelHist[wheelMonth]||{}); WHEEL.forEach(([k])=>{ if (w[k]==null) w[k]=5; }); save(); renderAll(); return; }
  if (d.msg){ state.msgs=Math.max(0,(+state.msgs||0)+(+d.msg)); save(); renderAll(); return; }
  toggle(t);
});
document.addEventListener("keydown", e => {
  const el = e.target;
  if ((e.key===" "||e.key==="Enter") && el.getAttribute && el.getAttribute("role")==="checkbox"){
    e.preventDefault(); const d = el.dataset;
    const sel2 = d.h?`[data-h="${d.h}"]`: d.ms?`[data-ms="${d.ms}"]`: d.my?`[data-my="${d.my}"]`: d.t?`[data-t="${d.t}"]`: d.c?"[data-c]": d.sign?"[data-sign]":"[data-w]";
    const sectionId = el.closest("section") && el.closest("section").id;
    toggle(el);
    const again = document.querySelector(`#${sectionId} ${sel2}`); if (again) again.focus();
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id==="note"){ rec(sel).note = t.value; save(); }
  else if (t.dataset.wk){ const now = pos(TODAY<START?START:TODAY) || {c:4,w:13}; const m = weekStart(now.c,now.w); state.weeks[m]=state.weeks[m]||{}; state.weeks[m][t.dataset.wk]=t.value; save(); }
  else if (t.dataset.cm){ state.commit=state.commit||{}; state.commit[t.dataset.cm]=t.value; save(); }
  else if (t.dataset.ca){ state.commit=state.commit||{}; const a=(state.commit.areas=state.commit.areas||{}); (a[t.dataset.ca]=a[t.dataset.ca]||{})[t.dataset.cf]=t.value; save(); }
  else if (t.dataset.goal){ state.goals=state.goals||{}; (state.goals[t.dataset.goal]=state.goals[t.dataset.goal]||{})[t.dataset.gf]=t.value; save(); }
  else if (t.dataset.vis){ state.vision=state.vision||{}; state.vision[t.dataset.vis]=t.value; save(); }
  else if (t.dataset.wheel){ state.wheelHist=state.wheelHist||{}; const w=(state.wheelHist[wheelMonth]=state.wheelHist[wheelMonth]||{}); if (!Object.keys(w).length) WHEEL.forEach(([k])=>w[k]=5); w[t.dataset.wheel]=+t.value; t.nextElementSibling.textContent=t.value; save(); }
});
document.addEventListener("change", e => {
  const t=e.target, v=Math.max(0, +t.value||0);
  if (t.dataset.wheel){ renderVision(); const s=$("wh-"+t.dataset.wheel); if (s) s.focus(); return; }
  if (t.dataset.sav) state.savings[t.dataset.sav]=v;
  else if (t.dataset.inc) state.income[t.dataset.inc]=v;
  else if (t.dataset.subs) state.subs=v;
  else return;
  save(); renderAll();
});
const TABS = ["today","cycle","year","goals","vision"];
function route(){
  const tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "today";
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab===tab));
  TABS.forEach(k => $("tab-"+k).hidden = k!==tab);
}
window.addEventListener("hashchange", route);
renderAll(); route();
</script>
</body>
</html>
